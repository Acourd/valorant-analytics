name: valorant-analytics CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node check_syntax.js
      - run: node run_all_tests.js
      - run: node opencode_tester.js

  # Modalidad de ESTRÉS acotada, separada de la matriz normal (no la ralentiza).
  # Sin reintentos: cualquier pérdida de claves falla el job con el error original.
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node tests/stress_dsse.js
        env:
          VA_STRESS_ROUNDS: "3"
